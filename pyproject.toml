[project]
name = "train"
version = "0.1.0"
description = "SRT/Korail train tools and Railway SRT cloud-IP smoke worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "psycopg[binary]>=3.2.0",
    "cryptography>=44.0.0",
    "pycryptodome>=3.21.0",
    "six>=1.16.0",
]

[dependency-groups]
# core cli deps (fill as needed)
cli = ["typer>=0.12.0", "rich>=13.0.0", "pydantic>=2.9"]
# srt backend deps (also covered by project.dependencies)
srt = ["requests>=2.32.0"]
# korail backend deps (requires AES CBC impl)
korail = ["requests>=2.32.0", "pycryptodome"]

[project.optional-dependencies]
cli = ["typer>=0.12.0", "rich>=13.0.0", "pydantic>=2.9"]
korail = ["pycryptodome"]
